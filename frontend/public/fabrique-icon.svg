<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Subtle grid (faint) -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="170" x2="512" y2="170" />
    <line x1="0" y1="342" x2="512" y2="342" />
    <line x1="170" y1="0" x2="170" y2="512" />
    <line x1="342" y1="0" x2="342" y2="512" />
  </g>

  <!-- Stylized F with rounded bars -->
  <g fill="url(#accent)">
    <!-- vertical stem -->
    <rect x="140" y="108" width="64" height="296" rx="12" />
    <!-- top arm -->
    <rect x="140" y="108" width="232" height="64" rx="12" />
    <!-- middle arm -->
    <rect x="140" y="224" width="168" height="64" rx="12" />
  </g>

  <!-- Accent dot -->
  <circle cx="372" cy="140" r="18" fill="#a78bfa" />
</svg>