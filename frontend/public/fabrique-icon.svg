<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: solid brand dark -->
  <rect width="512" height="512" rx="96" fill="#0f172a" />

  <!-- Subtle grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
  </g>

  <!-- Stylized F: vertical bar + two horizontal bars -->
  <g fill="#38bdf8">
    <!-- vertical -->
    <rect x="152" y="120" width="56" height="272" rx="8" />
    <!-- top bar -->
    <rect x="152" y="120" width="208" height="56" rx="8" />
    <!-- middle bar -->
    <rect x="152" y="228" width="152" height="56" rx="8" />
  </g>

  <!-- Accent dot (the "factory" spark) -->
  <circle cx="360" cy="148" r="20" fill="#a78bfa" />
</svg>