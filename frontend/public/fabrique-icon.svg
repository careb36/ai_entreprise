<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="fGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b" />
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Outer ring (factory cog) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.35" />
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.2" stroke-dasharray="4 8" />

  <!-- Cog teeth -->
  <g fill="url(#ringGrad)" opacity="0.5">
    <rect x="248" y="40" width="16" height="24" rx="4" />
    <rect x="248" y="448" width="16" height="24" rx="4" />
    <rect x="40" y="248" width="24" height="16" rx="4" />
    <rect x="448" y="248" width="24" height="16" rx="4" />
    <rect x="108" y="108" width="16" height="24" rx="4" transform="rotate(45 116 120)" />
    <rect x="388" y="108" width="16" height="24" rx="4" transform="rotate(-45 396 120)" />
    <rect x="108" y="380" width="16" height="24" rx="4" transform="rotate(-45 116 392)" />
    <rect x="388" y="380" width="16" height="24" rx="4" transform="rotate(45 396 392)" />
  </g>

  <!-- Central F monogram -->
  <g filter="url(#glow)">
    <!-- vertical stem -->
    <rect x="172" y="132" width="72" height="248" rx="14" fill="url(#fGrad)" />
    <!-- top arm -->
    <rect x="172" y="132" width="196" height="72" rx="14" fill="url(#fGrad)" />
    <!-- middle arm -->
    <rect x="172" y="228" width="140" height="64" rx="14" fill="url(#fGrad)" />
  </g>

  <!-- Spark accent -->
  <circle cx="368" cy="168" r="22" fill="#f472b6" filter="url(#glow)" />
  <circle cx="368" cy="168" r="10" fill="#ffffff" />
</svg>