# Alembic: the backend's versioned schema migrations (backend/alembic/).
# Run from backend/: `alembic upgrade head`, `alembic check`,
# `alembic revision --autogenerate -m "..."`. The database URL comes from the
# POSTGRES_* variables the backend reads (alembic/env.py), or from
# ALEMBIC_DATABASE_URL when set.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = . app
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
