# Keeps the commit SHAs the workflows pin up to date. Actions are pinned by
# SHA so CI never runs code from a moving tag or branch; Dependabot proposes
# each new release as a pull request, a week after it is published, and a
# person merges it. Major versions arrive on their own, never grouped.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
