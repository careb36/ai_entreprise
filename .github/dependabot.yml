version: 2

# Weekly, grouped dependency updates. Security updates are opened as soon as
# GitHub publishes them; grouped version updates keep the PR queue small.
updates:
  # Python — backend y llm-proxy usan Poetry; vscode-daemon usa requirements.txt.
  - package-ecosystem: pip
    directory: /backend
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # sqlmodel 0.0.48 exige datetimes con zona horaria; el codigo crea las
    # columnas con datetime.utcnow(). Las tres cifras estan en 0.0.x, asi que
    # para Dependabot todo salto es minor o patch: hay que ignorarlas todas
    # hasta que exista la migracion del modelo de datos.
    ignore:
      - dependency-name: "sqlmodel"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      backend-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /llm-proxy
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:20"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      llm-proxy-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # The daemon's lock is requirements.txt, compiled with hashes from
  # requirements.in by `uv pip compile` (its header names the command, which
  # is how Dependabot recompiles it rather than editing pins by hand).
  - package-ecosystem: pip
    directory: /vscode-daemon
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:25"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      vscode-daemon-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # Node — frontend/package.json + package-lock.json.
  - package-ecosystem: npm
    directory: /frontend
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # react 19 deja react-dom desemparejado y rompe tsc y los 49 ficheros de
    # test: necesita una migracion propia, no un bump automatico.
    # vite, vitest and @vitejs/plugin-react are not ignored any more (#522):
    # the project is on vite 8, plugin-react 6 and vitest 5, the latest
    # majors on 2026-11-18. Their next majors arrive together in the
    # `vite-toolchain` group below, since each needs the others' new major.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 moves its PostCSS plugin to @tailwindcss/postcss and needs
      # a config migration; #463 broke the build. Majors wait for that change.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        # Sin esto, un bump minor de react-dom cae aqui y un bump mayor de
        # react cae en el grupo `react`: llegan en PRs distintos y el par
        # queda desalineado, que es exactamente lo que rompio `npm ci` en #252.
        exclude-patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

      # The build and test toolchain moves its majors in one pull request:
      # @vitejs/plugin-react and vitest each declare a peer range on vite's
      # major, so a lone bump of any of the three fails `npm ci` (#522).
      vite-toolchain:
        applies-to: version-updates
        update-types: [major]
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/plugin-react"

      # React y React DOM se mueven siempre juntos: subir react-dom solo deja
      # react en el major anterior y `npm ci` muere con ERESOLVE. Los paquetes
      # @types tienen que seguir a su contraparte de runtime por lo mismo.
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  # Docker — un directorio por Dockerfile.
  - package-ecosystem: docker
    directory: /backend
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:35"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # The images stay on python 3.12: the backend's dependencies (greenlet,
    # regex, grpcio and others) publish no 3.15 wheels yet and the slim image
    # has no compiler to build them. 3.12.x patch updates still arrive.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /backend/janitor
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:36"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # The images stay on python 3.12: the backend's dependencies (greenlet,
    # regex, grpcio and others) publish no 3.15 wheels yet and the slim image
    # has no compiler to build them. 3.12.x patch updates still arrive.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /frontend
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:40"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /llm-proxy
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:45"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # The images stay on python 3.12: the backend's dependencies (greenlet,
    # regex, grpcio and others) publish no 3.15 wheels yet and the slim image
    # has no compiler to build them. 3.12.x patch updates still arrive.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /vscode-daemon
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:50"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # The images stay on python 3.12: the backend's dependencies (greenlet,
    # regex, grpcio and others) publish no 3.15 wheels yet and the slim image
    # has no compiler to build them. 3.12.x patch updates still arrive.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Docker Compose — la raíz solo tiene docker-compose.yml, sin Dockerfile,
  # así que el ecosistema "docker" no detectaría ese archivo.
  - package-ecosystem: docker-compose
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:55"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # The images stay on python 3.12: the backend's dependencies (greenlet,
    # regex, grpcio and others) publish no 3.15 wheels yet and the slim image
    # has no compiler to build them. 3.12.x patch updates still arrive.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # GitHub Actions — los workflows de .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
