name: Docker Build

# Construir cada imagen desde cero detecta lo que ningún test unitario ve: un
# `COPY` que se olvidó un módulo (el proxy arrancaba a `ModuleNotFoundError:
# No module named 'upstream'`), una dependencia que solo existe en el venv de
# desarrollo, un `setuptools` que instaló bien y rompe al importar. Los tests
# corren sobre el árbol de trabajo; esto corre sobre lo que realmente se
# despliega.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The self-hosted runners are shared by every pull request and by main: a new
# push cancels the runs of the commit it replaces, on main too (the newest
# commit's run covers the ones merged before it), instead of queueing behind them.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  build:
    needs: changes
    # Not a job-level `if` on the image: a matrix job skipped that way is
    # reported once under the bare job name, and the required check
    # "build (<image>)" would wait forever. Each image's job starts, and
    # its steps run only when BUILD is 'true' (that image's context changed,
    # or the filter failed); otherwise it ends in seconds as a success.
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, linux, x64, lafabrique]
    env:
      BUILD: ${{ needs.changes.result != 'success' || needs.changes.outputs[matrix.filter] == 'true' }}
      # One tag per run and attempt: the self-hosted runners share one Docker
      # daemon, and a fixed tag let one job's cleanup (`docker rmi -f`) delete
      # the image another job had just built (PR #588's backend build).
      IMAGE: fabrique-${{ matrix.name }}:ci-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Una imagen rota no debe esconder el estado de las otras cuatro.
      fail-fast: false
      matrix:
        include:
          - name: backend
            filter: docker-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: janitor
            filter: docker-janitor
            # El Dockerfile copia `backend/janitor/main.py`, así que el
            # contexto es la raíz (igual que en docker-compose.yml).
            context: .
            dockerfile: ./backend/janitor/Dockerfile
          - name: frontend
            filter: docker-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - name: llm-proxy
            filter: docker-llm-proxy
            context: ./llm-proxy
            dockerfile: ./llm-proxy/Dockerfile
          - name: vscode-daemon
            filter: docker-vscode-daemon
            context: ./vscode-daemon
            dockerfile: ./vscode-daemon/Dockerfile
    steps:
      - name: Nothing in ${{ matrix.name }}'s build context changed
        if: env.BUILD != 'true'
        env:
          NAME: ${{ matrix.name }}
        run: echo "Skipped, this pull request does not change the build context of $NAME (changes.yml)."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.BUILD == 'true'

      - name: Build ${{ matrix.name }}
        if: env.BUILD == 'true'
        run: |
          docker build \
            --file "${{ matrix.dockerfile }}" \
            --tag "$IMAGE" \
            "${{ matrix.context }}"

      # Construir no prueba que el proceso arranque: el proxy compilaba bien y
      # moría en el primer import. Estos pasos ejecutan la imagen.
      - name: Smoke test llm-proxy (serves /health)
        if: env.BUILD == 'true' && matrix.name == 'llm-proxy'
        env:
          # El runner es compartido y dos corridas de refs distintas no se
          # serializan por el bloque `concurrency`: nombre y puerto fijos se
          # pisarían entre ellas.
          CONTAINER: fabrique-llm-proxy-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker run -d --name "$CONTAINER" \
            --publish 127.0.0.1::5100 "$IMAGE"
          PORT=$(docker port "$CONTAINER" 5100 | head -1 | sed 's/.*://')
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$PORT/health" > /dev/null 2>&1; then
              echo "llm-proxy responds on /health (port $PORT)"
              exit 0
            fi
            sleep 1
          done
          echo "llm-proxy did not answer on /health; container logs:"
          docker logs "$CONTAINER"
          exit 1

      # El backend necesita Postgres para arrancar, así que aquí solo se
      # comprueba lo que el `COPY` incompleto rompía: que todo import resuelva.
      - name: Smoke test backend (imports resolve)
        if: env.BUILD == 'true' && matrix.name == 'backend'
        run: |
          docker run --rm --entrypoint python "$IMAGE" \
            -c "import app.main; print('imports OK')"

      # Este Dockerfile copiaba un solo archivo, así que un módulo nuevo al lado
      # de daemon.py se quedaba fuera de la imagen. Importarlo lo detecta.
      - name: Smoke test vscode-daemon (imports resolve)
        if: env.BUILD == 'true' && matrix.name == 'vscode-daemon'
        run: |
          docker run --rm --entrypoint python "$IMAGE" \
            -c "import daemon; print('daemon imports OK')"

      # Solo el job del proxy deja un contenedor. Los dos runners comparten el
      # Docker de la máquina, así que si cada job de la matriz borrara el
      # nombre, el del daemon mataba el contenedor del proxy mientras este
      # esperaba /health.
      - name: Clean up ${{ matrix.name }}
        if: always() && env.BUILD == 'true'
        env:
          CONTAINER: fabrique-llm-proxy-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ "${{ matrix.name }}" = "llm-proxy" ]; then
            docker rm -f "$CONTAINER" 2>/dev/null || true
          fi
          docker rmi -f "$IMAGE" 2>/dev/null || true
