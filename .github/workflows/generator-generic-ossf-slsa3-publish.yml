# SLSA Level 3 Provenance — Le Fabrique
# Generates cryptographic provenance for Docker images on each release.
# Verify with: https://github.com/slsa-framework/slsa-verifier
# Spec: https://slsa.dev/spec/v0.1/requirements

name: SLSA Provenance — Le Fabrique

on:
  workflow_dispatch:
  release:
    types: [created]


# Un único runner self-hosted atiende un job a la vez: al llegar un push nuevo
# se cancelan las ejecuciones del commit que reemplaza en vez de encolarse.
concurrency:
  group: slsa3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    name: Build & hash Docker images
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker images
        run: |
          docker build -t le-fabrique-backend:${{ github.ref_name }}   ./backend
          docker build -t le-fabrique-frontend:${{ github.ref_name }}  ./frontend
          docker build -t le-fabrique-llm-proxy:${{ github.ref_name }} ./llm-proxy

      - name: Export images as tarballs
        run: |
          docker save le-fabrique-backend:${{ github.ref_name }}   -o le-fabrique-backend.tar
          docker save le-fabrique-frontend:${{ github.ref_name }}  -o le-fabrique-frontend.tar
          docker save le-fabrique-llm-proxy:${{ github.ref_name }} -o le-fabrique-llm-proxy.tar

      - name: Generate SHA256 subjects
        id: hash
        run: |
          set -euo pipefail
          echo "digests=$(sha256sum le-fabrique-*.tar | base64 -w0)" >> "${GITHUB_OUTPUT}"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: le-fabrique-images-${{ github.ref_name }}
          path: le-fabrique-*.tar
          retention-days: 5

  provenance:
    name: Generate SLSA provenance
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    # The one action not pinned by commit sha: the SLSA generator verifies its
    # own ref and refuses to run unless the reusable workflow is called by a
    # full `@vX.Y.Z` release tag (slsa-github-generator README, "Referencing
    # SLSA builders and generators"). The tag is f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
    # today; backend/tests/test_workflow_pinning.py allows this one entry.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true
