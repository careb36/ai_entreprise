# Frontend build — runs typecheck, tests, and build on every pull request that touches
# frontend code or this workflow, and on pushes to the main branch
# branches. Pushes to other branches do not trigger it; open a pull request for
# a run.
#
# Run the same checks locally with:
#   python3 scripts/check_frontend_architecture.py
#   cd frontend && npm ci && npx tsc --noEmit && npm run lint && npm run test:run && npm run build

name: Frontend Build

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/check_frontend_architecture.py'
      - 'docs/architecture/frontend.json'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/check_frontend_architecture.py'
      - 'docs/architecture/frontend.json'
      - '.github/workflows/frontend-build.yml'
  workflow_dispatch:

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: typecheck, test, and build (Node 24)
    runs-on: [self-hosted, linux, x64, lafabrique]
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check the dependency rule between layers
        # docs/contexts/frontend.md, issue #519: an import from a layer above,
        # the network outside the listed services modules or a file in no
        # layer fails; the allowlist in docs/architecture/frontend.json may
        # only shrink. Standard-library Python, from the repository root.
        working-directory: .
        run: python3 -I scripts/check_frontend_architecture.py

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # No Actions cache: on the self-hosted runner it archives the whole
          # ~/.npm (1.8 GB), whose restore and save time out and cancel the
          # job after its steps passed. The runner keeps ~/.npm between jobs,
          # so `npm ci` reads it locally anyway.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (user-facing text goes through i18n)
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
