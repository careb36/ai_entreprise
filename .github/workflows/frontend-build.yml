# Frontend build — runs typecheck, tests, and build on every pull request that touches
# frontend code or this workflow, and on pushes to the main and develop
# branches. Pushes to other branches do not trigger it; open a pull request for
# a run.
#
# Run the same checks locally with:
#   cd frontend && npm ci && npm run lint -- src && npx tsc --noEmit && npm run test:run && npm run build

name: Frontend Build

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  workflow_dispatch:

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: typecheck, test, and build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint -- src

      - name: Check formatting of changed frontend files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_sha="$BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD^)"
          fi

          mapfile -d '' -t formatted_files < <(
            git -C "$GITHUB_WORKSPACE" diff --name-only --diff-filter=ACMRT -z "$base_sha" "$GITHUB_SHA" -- frontend |
              while IFS= read -r -d '' file; do
                case "$file" in
                  *.ts|*.tsx|*.js|*.jsx|*.mjs|*.cjs|*.json|*.css|*.html|*.md)
                    printf '%s\0' "${file#frontend/}"
                    ;;
                esac
              done
          )
          if ((${#formatted_files[@]} > 0)); then
            npm run format:check -- "${formatted_files[@]}"
          else
            echo "No changed frontend files supported by Prettier."
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Add failure notification
        if: failure()
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "::error title=Frontend CI failed::Review $run_url"
          echo "Frontend CI failed. [Review the workflow run]($run_url)." >> "$GITHUB_STEP_SUMMARY"
