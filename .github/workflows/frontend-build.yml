# Frontend build — runs typecheck, tests, and build on every pull request, on
# pushes to the main branch and on demand. On a pull request the `changes` job
# (changes.yml) skips the build unless the change touches frontend/, the layer
# rules (docs/architecture/frontend.json, scripts/check_frontend_architecture.py)
# or a workflow; a skipped build still reports, so a required check never waits.
# Pushes to other branches do not trigger it; open a pull request for a run.
#
# Run the same checks locally with:
#   python3 scripts/check_frontend_architecture.py
#   cd frontend && npm ci && npx tsc --noEmit && npm run lint && npm run test:run && npm run build

name: Frontend Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The self-hosted runners are shared by every pull request and by main: a new
# push cancels the runs of the commit it replaces, on main too (the newest
# commit's run covers the ones merged before it), instead of queueing behind them.
concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  build:
    name: typecheck, test, and build (Node 24)
    needs: changes
    # A broken filter runs the build rather than skipping it.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: [self-hosted, linux, x64, lafabrique]
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the dependency rule between layers
        # docs/contexts/frontend.md, issue #519: an import from a layer above,
        # the network outside the listed services modules or a file in no
        # layer fails; the allowlist in docs/architecture/frontend.json may
        # only shrink. Standard-library Python, from the repository root.
        working-directory: .
        run: python3 -I scripts/check_frontend_architecture.py

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # No Actions cache: on the self-hosted runner it archives the whole
          # ~/.npm (1.8 GB), whose restore and save time out and cancel the
          # job after its steps passed. The runner keeps ~/.npm between jobs,
          # so `npm ci` reads it locally anyway.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (user-facing text goes through i18n)
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
