# Adapted from AixleHQ/flow (https://github.com/AixleHQ/flow, commit f9efa22),
# .github/workflows/images.yml, Copyright 2026 Dualboot Partners, LLC, licensed
# under the Apache License 2.0. See NOTICE. Taken: publish only from a release
# tag, one version tag for every image, `latest` only for a stable release,
# the main-ancestry check, and no cancelling of an in-flight publish. Changed
# here: the same five images docker-build.yml builds, with plain `docker build`
# and `docker push` on the self-hosted runner, linux/amd64 only, plus the
# browser sandbox (issue #529) built with buildx for linux/amd64 only: its
# arm64 variant builds under QEMU but its browser aborts under emulation
# (browser-image-probe.yml, run 43746887213), so it is not published until it
# has been run on arm64 hardware; no canary.
#
# Each pushed image is then described and signed by its digest (issue #522,
# part C): a CycloneDX SBOM made by syft (Apache-2.0, pinned, checksum
# checked), kept as an artifact of the run; a keyless cosign signature, whose
# certificate Fulcio issues for this workflow's GitHub OIDC identity and whose
# entry is in the public Rekor log; and the SBOM attached to the image as a
# signed attestation. How to verify both: docs/OPERATIONS.md, Releasing.
name: Publish Images

# Pushing vX.Y.Z publishes ghcr.io/<owner>/<repo>/<service>:X.Y.Z, and
# :latest for a stable release. A merge to main publishes nothing: docker-build.yml
# builds and smoke-tests the same images on every push to main.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Serialise per ref rather than cancelling: a cancelled publish can leave a tag
# pointing at a half-pushed image.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve Version
    runs-on: [self-hosted, linux, x64, lafabrique]
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve Version
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::${GITHUB_REF_NAME} is not a vX.Y.Z or vX.Y.Z-pre release tag."
            exit 1
          fi
          # A tag off main would still move `latest`.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main; releases are tagged from main."
            exit 1
          fi
          stable=false
          if [[ "$version" != *-* ]]; then stable=true; fi
          { echo "version=${version}"; echo "stable=${stable}"; } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.name }}
    runs-on: [self-hosted, linux, x64, lafabrique]
    timeout-minutes: 45
    needs: version
    # id-token: write lets cosign ask GitHub for this job's OIDC token, which
    # Fulcio exchanges for a short-lived signing certificate; no key is stored.
    # It is granted to this job only.
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      # Each image stands alone: one broken build must not cancel the others.
      fail-fast: false
      # The same list as docker-build.yml (backend/tests/test_release_notes.py
      # keeps the two equal).
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: janitor
            context: .
            dockerfile: ./backend/janitor/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - name: llm-proxy
            context: ./llm-proxy
            dockerfile: ./llm-proxy/Dockerfile
          - name: vscode-daemon
            context: ./vscode-daemon
            dockerfile: ./vscode-daemon/Dockerfile
    env:
      VERSION: ${{ needs.version.outputs.version }}
      STABLE: ${{ needs.version.outputs.stable }}
      NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ${{ matrix.name }}
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
        run: |
          set -euo pipefail
          # GHCR rejects uppercase path segments.
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${NAME}"
          docker build \
            --file "$DOCKERFILE" \
            --tag "${image}:${VERSION}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "$CONTEXT"
          if [ "$STABLE" = "true" ]; then docker tag "${image}:${VERSION}" "${image}:latest"; fi

      # The runner's Docker is shared between jobs, so the login lives in a
      # config directory of this job's own and is removed with it.
      - name: Push ${{ matrix.name }}
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config-${NAME}"
          mkdir -p "$DOCKER_CONFIG"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${NAME}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "${image}:${VERSION}"
          if [ "$STABLE" = "true" ]; then docker push "${image}:latest"; fi
          # What the registry stored, by content: the signature and the SBOM
          # name this digest, never a tag that can be moved.
          # (No match is not a pipeline failure here: the check below names it.)
          ref="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${image}:${VERSION}" \
            | { grep -E "^${image}@sha256:[0-9a-f]{64}$" || :; } | head -n 1)"
          if [ -z "$ref" ]; then
            echo "::error::no registry digest for ${image}:${VERSION} after the push"
            exit 1
          fi
          echo "IMAGE_REF=${ref}" >> "$GITHUB_ENV"
          echo "Published \`${image}:${VERSION}\` as \`${ref}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install syft (pinned + checksum)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o syft.tgz \
            https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz
          echo "bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d  syft.tgz" | sha256sum -c -
          tar -xzf syft.tgz syft
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 syft "$RUNNER_TEMP/bin/syft"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/syft" version

      - name: SBOM of ${{ matrix.name }}
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sbom"
          # The local image is the one just pushed (same digest); reading it
          # from the Docker daemon needs no registry credential.
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${NAME}"
          syft scan "docker:${image}:${VERSION}" \
            --source-name "${NAME}" --source-version "${VERSION}" \
            -o "cyclonedx-json=$RUNNER_TEMP/sbom/${NAME}-${VERSION}.cdx.json"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      # Keyless: the certificate names this workflow file and the tag
      # (https://github.com/<owner>/<repo>/.github/workflows/images.yml@refs/tags/vX.Y.Z),
      # which is what `cosign verify` checks.
      - name: Sign ${{ matrix.name }} and attest its SBOM
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config-${NAME}"
          cosign sign --yes "$IMAGE_REF"
          cosign attest --yes --type cyclonedx \
            --predicate "$RUNNER_TEMP/sbom/${NAME}-${VERSION}.cdx.json" "$IMAGE_REF"
          echo "Signed \`${IMAGE_REF}\` and attested its CycloneDX SBOM" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the SBOM of ${{ matrix.name }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error
          retention-days: 90

      - name: Clean up ${{ matrix.name }}
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/docker-config-${NAME}" "$RUNNER_TEMP/sbom"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${NAME}"
          docker rmi -f "${image}:${VERSION}" 2>/dev/null || true
          if [ "$STABLE" = "true" ]; then docker rmi -f "${image}:latest" 2>/dev/null || true; fi

  # The browser sandbox (issue #529): the sixth published image, outside the
  # five-image matrix above — that matrix is the list docker-build.yml builds
  # per pull request (backend/tests/test_release_notes.py holds the two
  # equal), and docker-build.yml does not build this one. Built with buildx
  # for linux/amd64 only; browser-image-probe.yml (a manual workflow_dispatch
  # run) is where an arm64 variant is checked before it is ever published.
  # Same tags, same SBOM, same keyless signature as the five others; the only
  # difference at signing is that the digest comes from buildx's metadata
  # file, the image never reaching the Docker daemon.
  publish-browser:
    name: Publish browser-sandbox
    runs-on: [self-hosted, linux, x64, lafabrique]
    timeout-minutes: 120
    needs: version
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      STABLE: ${{ needs.version.outputs.stable }}
      NAME: browser-sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # linux/amd64 only (issue #529): the arm64 variant's browser aborts under
      # QEMU, so nobody has seen it work; it is published once it has been run
      # on arm64 hardware with its probe.
      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The runner's Docker is shared between jobs, so the login lives in a
      # config directory of this job's own and is removed with it.
      - name: Build and push browser-sandbox
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config-${NAME}"
          mkdir -p "$DOCKER_CONFIG"
          # GHCR rejects uppercase path segments.
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${NAME}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          tags=(--tag "${image}:${VERSION}")
          if [ "$STABLE" = "true" ]; then tags+=(--tag "${image}:latest"); fi
          # --provenance=false keeps the pushed artifact the shape of the
          # other five (plain images): the SLSA elements here are the keyless
          # signature and the signed SBOM attestation below, as in #551.
          docker buildx build \
            --platform linux/amd64 \
            "${tags[@]}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --provenance=false \
            --metadata-file "$RUNNER_TEMP/buildx-metadata.json" \
            --push \
            ./vscode-daemon/images/browser
          # What the registry stored, by content: the signature and the SBOM
          # name this digest of the manifest list, never a tag that can be
          # moved. buildx reports it in its metadata file.
          digest="$(python3 -c \
            'import json, sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' \
            "$RUNNER_TEMP/buildx-metadata.json")"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::buildx reported no image digest for ${image}:${VERSION}"
            exit 1
          fi
          echo "IMAGE_REF=${image}@${digest}" >> "$GITHUB_ENV"
          {
            echo "Published \`${image}:${VERSION}\` (linux/amd64) as \`${image}@${digest}\`"
            echo "Operators: \`DELIVERY_BROWSER_IMAGE=${image}@${digest}\` (docs/CONFIGURATION.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install syft (pinned + checksum)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o syft.tgz \
            https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz
          echo "bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d  syft.tgz" | sha256sum -c -
          tar -xzf syft.tgz syft
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 syft "$RUNNER_TEMP/bin/syft"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/syft" version

      - name: SBOM of browser-sandbox
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config-${NAME}"
          mkdir -p "$RUNNER_TEMP/sbom"
          # buildx pushes without loading into the Docker daemon, so syft
          # reads the registry by digest with this job's login.
          syft scan "registry:${IMAGE_REF}" \
            --source-name "${NAME}" --source-version "${VERSION}" \
            -o "cyclonedx-json=$RUNNER_TEMP/sbom/${NAME}-${VERSION}.cdx.json"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      # Keyless, as the five others: the certificate names this workflow file
      # and the tag, which is what `cosign verify` checks.
      - name: Sign browser-sandbox and attest its SBOM
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config-${NAME}"
          cosign sign --yes "$IMAGE_REF"
          cosign attest --yes --type cyclonedx \
            --predicate "$RUNNER_TEMP/sbom/${NAME}-${VERSION}.cdx.json" "$IMAGE_REF"
          echo "Signed \`${IMAGE_REF}\` and attested its CycloneDX SBOM" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the SBOM of browser-sandbox
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-browser-sandbox
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error
          retention-days: 90

      - name: Clean up browser-sandbox
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/docker-config-${NAME}" "$RUNNER_TEMP/sbom" \
            "$RUNNER_TEMP/buildx-metadata.json"
