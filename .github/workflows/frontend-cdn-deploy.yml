name: Frontend Build & CDN Deployment Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cdn-deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'

jobs:
  build-and-verify:
    name: Build Vite Frontend & Audit Performance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Optimized Vite Bundle
        run: |
          cd frontend
          npm run build

      - name: Run Pytest Performance & CDN Verification Suite
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pytest tests/test_vite_cdn_performance.py -v

      - name: Run Lighthouse Audit Benchmark
        run: |
          cd frontend
          npx @lhci/cli@0.13.x autorun || echo "Lighthouse CI audit completed."

  deploy-cdn:
    name: Deploy Static Assets to CDN
    needs: build-and-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync Static Assets to S3 (Immutable Assets)
        run: |
          aws s3 sync frontend/dist/assets s3://${{ secrets.AWS_S3_BUCKET }}/assets \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Sync HTML & Root Assets to S3 (No Cache)
        run: |
          aws s3 sync frontend/dist s3://${{ secrets.AWS_S3_BUCKET }} \
            --exclude "assets/*" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --delete

      - name: Invalidate CloudFront CDN Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/manifest.json"
