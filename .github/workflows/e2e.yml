name: End to end

# The whole loop against a real Postgres and NATS: scripts/e2e/run.sh starts
# the backend, the workspace daemon and a fake LLM proxy, drives one company
# from its foundation sprint through a blocked task, the ScrumMaster's triage,
# the retrospective, a carry-over and a verified delivery, and checks each
# step through the API. Neo4j is not part of it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The self-hosted runners are shared by every pull request and by main: a new
# push cancels the runs of the commit it replaces, on main too (the newest
# commit's run covers the ones merged before it), instead of queueing behind them.
#
# This group only cancels superseded runs of the same ref. How many e2e jobs
# run on the machine at once, across every pull request, is set by the runner
# label below, not here: a concurrency group holds one running and one pending
# run, and a third arrival cancels the pending one, which is a failed check.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  e2e:
    needs: changes
    # Not a job-level `if` on the paths: a matrix job skipped that way reports
    # once under the bare name `e2e`, and the checks "e2e (host)" and
    # "e2e (container)" would wait forever. Both start; when E2E_RUN is not
    # 'true' every step is skipped and the job ends in seconds as a success.
    if: ${{ !cancelled() }}
    # upload-artifact needs to write to the run's artifact store; a bare
    # `contents: read` would make the keep-the-logs step fail.
    permissions:
      contents: read
      actions: write
    # Runs on the self-hosted runner like every other workflow: hosted runners
    # are blocked by the account's spending limit, so a job on ubuntu-latest
    # never starts and reports a failure it never produced.
    #
    # At most two e2e jobs on the machine at once (each starts Postgres, NATS,
    # the backend and the daemon: two at a time is what four cores and 16 GB
    # hold beside the other jobs). A job that runs the loop asks for the
    # extra label `e2e`, which only two of the seven runners carry; GitHub
    # queues the rest until one of those two is free and cancels nothing. The limit is the number of runners with the label
    # (docs/OPERATIONS.md, Runner capacity); the repository variable
    # E2E_RUNS_ON replaces the label list, e.g. with the plain
    # '["self-hosted","linux","x64","lafabrique"]' to lift the limit. A job
    # with nothing to run takes any runner, so a skipped e2e never waits for
    # an e2e slot.
    runs-on: ${{ fromJSON((needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') && (vars.E2E_RUNS_ON || '["self-hosted","linux","x64","lafabrique","e2e"]') || '["self-hosted","linux","x64","lafabrique"]') }}
    timeout-minutes: 25
    # Once with agent-written code on the host, once in a container per run
    # (DELIVERY_SANDBOX=container): the daemon's report must say which.
    strategy:
      fail-fast: false
      matrix:
        sandbox: [host, container]


    # Postgres and NATS are started as plain containers on ports picked at run
    # time. Binding the service container to a fixed host port made the job die
    # in eleven seconds with "port is already allocated" whenever anything else
    # on the runner (another e2e run, a leftover container, a local
    # `docker compose up`) held 5433 or 4223.
    env:
      # A nivel de job: el venv se crea en el paso de install y lo consume el
      # paso del e2e, que corre en otra shell. Si solo lo tuviera el primero,
      # el segundo resolvería otro directorio y crearía un venv vacío.
      # `runner.temp` no vale aquí: el contexto `runner` no existe en un `env`
      # de job y deja el workflow inválido.
      POETRY_VIRTUALENVS_PATH: ${{ github.workspace }}/.poetry-backend
      # Poetry consulta el keyring en cada operación. En un runner sin sesión
      # de escritorio completa, secretstorage abre DBus, no recibe respuesta y
      # aborta el `poetry install` ("Cannot install greenlet"). No hay ningún
      # secreto que buscar aquí: la clave se lee del entorno.
      POETRY_NO_INTERACTION: "1"
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
      # 'true' when the pull request changes what the loop runs (changes.yml),
      # on every push to main, and when the filter failed.
      E2E_RUN: ${{ needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true' }}
    steps:
      - name: Nothing the loop runs changed
        if: env.E2E_RUN != 'true'
        run: echo "Skipped, this pull request changes nothing the end-to-end run reads (changes.yml)."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.E2E_RUN == 'true'

      - name: Start Postgres, NATS and pick free ports
        if: env.E2E_RUN == 'true'
        env:
          # Optional memory caps for the two containers (`docker run --memory`,
          # e.g. 1g and 256m), from repository variables; empty means no cap.
          # docs/OPERATIONS.md, Runner capacity.
          PG_MEMORY: ${{ vars.E2E_POSTGRES_MEMORY }}
          NATS_MEMORY: ${{ vars.E2E_NATS_MEMORY }}
        run: |
          # Docker itself picks the port (empty host side of -p), then the
          # mapping is read back. Binding an ephemeral port in Python and
          # passing it to Docker loses a race: this host runs several
          # self-hosted agents against one Docker daemon, so two concurrent
          # e2e runs get the same free port and the second container cannot
          # bind it ("pg_isready: rejecting connections" for a minute).
          #
          # A service container cannot be given arguments and the stock NATS
          # image starts without JetStream, which the backend needs for the
          # durable task queue the loop relies on.
          #
          # A re-run keeps the run id, so an attempt whose runner died before
          # its cleanup step leaves these names taken ("Conflict. The
          # container name ... is already in use"). Only this run's own
          # containers carry them, so removing them first is safe. With -v: the
          # pgvector image declares a VOLUME, so each of these containers owns an
          # anonymous volume, and without it the volume of a dead attempt is left
          # behind (#566).
          docker rm -fv "pg-e2e-$GITHUB_RUN_ID-${{ matrix.sandbox }}" \
            "nats-e2e-$GITHUB_RUN_ID-${{ matrix.sandbox }}" >/dev/null 2>&1 || true
          pg_limits=()
          if [ -n "$PG_MEMORY" ]; then pg_limits=(--memory "$PG_MEMORY"); fi
          nats_limits=()
          if [ -n "$NATS_MEMORY" ]; then nats_limits=(--memory "$NATS_MEMORY"); fi
          docker run -d --name "pg-e2e-$GITHUB_RUN_ID-${{ matrix.sandbox }}" "${pg_limits[@]}" \
            -e POSTGRES_USER=factory -e POSTGRES_PASSWORD=factorypw -e POSTGRES_DB=factory \
            -p "127.0.0.1::5432" pgvector/pgvector:pg15
          docker run -d --name "nats-e2e-$GITHUB_RUN_ID-${{ matrix.sandbox }}" "${nats_limits[@]}" \
            -p "127.0.0.1::4222" nats:2.10 -js

          pg_port="$(docker port "pg-e2e-$GITHUB_RUN_ID-${{ matrix.sandbox }}" 5432/tcp | head -1 | sed 's/.*://')"
          nats_port="$(docker port "nats-e2e-$GITHUB_RUN_ID-${{ matrix.sandbox }}" 4222/tcp | head -1 | sed 's/.*://')"

          # TCP, not the Unix socket: the image starts a temporary server that
          # listens on the socket alone while it runs the init scripts, so
          # `pg_isready` with no -h answers "accepting" seconds before the real
          # postmaster is up, the loop breaks on that false positive, and the
          # next check lands in the gap and exits 1. The backend also connects
          # over TCP on the mapped port, so that is what has to answer.
          for _ in $(seq 1 60); do
            docker exec "pg-e2e-$GITHUB_RUN_ID-${{ matrix.sandbox }}" pg_isready -U factory -h 127.0.0.1 >/dev/null 2>&1 && break
            sleep 1
          done
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/"$nats_port") 2>/dev/null && break
            sleep 1
          done
          # A ready socket is not a ready port, and the port is what the e2e
          # talks to. Fail here, loudly, instead of inside the run.
          docker exec "pg-e2e-$GITHUB_RUN_ID-${{ matrix.sandbox }}" pg_isready -U factory -h 127.0.0.1

          {
            echo "E2E_POSTGRES_HOST=127.0.0.1"
            echo "E2E_POSTGRES_PORT=$pg_port"
            echo "E2E_POSTGRES_USER=factory"
            echo "E2E_POSTGRES_PASSWORD=factorypw"
            echo "E2E_NATS_URL=nats://127.0.0.1:$nats_port"
          } >> "$GITHUB_ENV"
          echo "postgres port: $pg_port / nats port: $nats_port"

      - name: Set up Python 3.12 (uv)
        if: env.E2E_RUN == 'true'
        shell: bash
        run: |
          python3 -m pip install --user --break-system-packages uv >/dev/null
          ~/.local/bin/uv python install 3.12
          ~/.local/bin/uv venv --python 3.12 --seed "$RUNNER_TEMP/venv-3.12"
          echo "$RUNNER_TEMP/venv-3.12/bin" >> "$GITHUB_PATH"

      - name: Install the backend
        if: env.E2E_RUN == 'true'
        working-directory: ./backend
        run: |
          # `--python` explícito: sin él, uv busca un `.venv` hacia arriba y en
          # este runner encuentra /home/caro/Dev/.venv (Python 3.14, del host).
          # Instalaba Poetry ahí, fuera del PATH, y el siguiente paso moría con
          # `poetry: command not found`.
          ~/.local/bin/uv pip install --python "$RUNNER_TEMP/venv-3.12/bin/python" poetry >/dev/null
          poetry env use python
          poetry install --no-interaction

      - name: Run the loop end to end
        if: env.E2E_RUN == 'true'
        env:
          E2E_WORKDIR: ${{ runner.temp }}/e2e
          E2E_SANDBOX: ${{ matrix.sandbox }}
        run: |
          # Ask Poetry which interpreter has the dependencies: it owns the
          # backend's virtualenv, so this is the only reliable answer.
          pick_port() { python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()'; }
          E2E_BACKEND_PORT="$(pick_port)"
          E2E_LLM_PORT="$(pick_port)"
          # The web project's application (step 9c): a fixed port collided
          # with another run on this machine (run 43752094404).
          E2E_WEB_PORT="$(pick_port)"
          export E2E_BACKEND_PORT E2E_LLM_PORT E2E_WEB_PORT
          echo "backend port: $E2E_BACKEND_PORT / llm port: $E2E_LLM_PORT / web port: $E2E_WEB_PORT"
          E2E_PYTHON="$(cd backend && poetry run python -c 'import sys; print(sys.executable)')" \
            bash scripts/e2e/run.sh

      # Issue #328: the backup script against the database the loop just
      # filled, restored into a scratch database (the restore creates it)
      # that must hold the same tables and the same audit chain length.
      - name: Back up and restore the e2e database
        if: env.E2E_RUN == 'true' && matrix.sandbox == 'host'
        env:
          PG_CONTAINER: pg-e2e-${{ github.run_id }}-${{ matrix.sandbox }}
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factorypw
          BACKUP_DIR: ${{ runner.temp }}/backups
        run: |
          POSTGRES_DB=factory_e2e bash scripts/backup.sh
          dump="$(find "$BACKUP_DIR" -maxdepth 1 -name 'postgres-factory_e2e-*.dump' | sort | tail -1)"
          POSTGRES_DB=factory_restore bash scripts/backup.sh restore "$dump" --yes
          count() {
            docker exec "$PG_CONTAINER" psql -U factory -d "$1" -tAc \
              "SELECT (SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public') || '/' || (SELECT count(*) FROM audit_log)"
          }
          echo "source $(count factory_e2e) / restored $(count factory_restore)"
          test "$(count factory_e2e)" = "$(count factory_restore)"

      # Issue #328: two workers racing on one sprint, on Postgres, where the
      # advisory locks and the conditional updates are real (the backend
      # suite runs the same races on SQLite).
      - name: Two workers on Postgres
        if: env.E2E_RUN == 'true' && matrix.sandbox == 'host'
        working-directory: ./backend
        run: |
          REPLICAS_POSTGRES_URL="postgresql://factory:factorypw@127.0.0.1:${E2E_POSTGRES_PORT}/factory_e2e" \
            PYTHONPATH=.:app poetry run python -m pytest tests/test_replicas.py -q -k postgres

      - name: Stop the containers
        if: always() && env.E2E_RUN == 'true'
        run: |
          # -v again: the anonymous volume of this run's pgvector container goes
          # with it, so a completed run leaks nothing (#566).
          docker rm -fv "pg-e2e-$GITHUB_RUN_ID-${{ matrix.sandbox }}" "nats-e2e-$GITHUB_RUN_ID-${{ matrix.sandbox }}" || true

      - name: Keep the logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && env.E2E_RUN == 'true'
        with:
          name: e2e-logs-${{ matrix.sandbox }}
          # The run's logs, and the self-hosting harness's (step 9d,
          # scripts/e2e/self_host_step.sh): a step that hangs until the job's
          # timeout (#575) still leaves its last output here.
          path: |
            ${{ runner.temp }}/e2e/*.log
            ${{ runner.temp }}/e2e/self-host/*.log
            ${{ runner.temp }}/e2e/self-host/*.json
          if-no-files-found: ignore
