name: End to end

# The whole loop against a real Postgres and NATS: scripts/e2e/run.sh starts
# the backend, the workspace daemon and a fake LLM proxy, drives one company
# from its foundation sprint through a blocked task, the ScrumMaster's triage,
# the retrospective, a carry-over and a verified delivery, and checks each
# step through the API. Neo4j is not part of it.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'vscode-daemon/**'
      - 'scripts/e2e/**'
      - '.github/workflows/e2e.yml'

jobs:
  e2e:
    runs-on: [self-hosted, linux, x64, lafabrique]
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factorypw
          POSTGRES_DB: factory
        # Not the default ports: the self-hosted runner's machine may run the
        # project's own stack on 5432 and 4222.
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U factory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A service container cannot be given arguments, and the stock NATS
      # image starts without JetStream; the backend needs it for the durable
      # task queue the loop relies on.
      - name: Start NATS with JetStream
        run: |
          # The runner persists between jobs: drop a container a cancelled run left.
          docker rm -f e2e-nats 2>/dev/null || true
          docker run -d --name e2e-nats -p 54222:4222 nats:2.10 -js
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/54222) 2>/dev/null && break
            sleep 1
          done

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install the backend
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction

      - name: Run the loop end to end
        env:
          E2E_POSTGRES_HOST: 127.0.0.1
          E2E_POSTGRES_PORT: '55432'
          E2E_POSTGRES_USER: factory
          E2E_POSTGRES_PASSWORD: factorypw
          E2E_NATS_URL: nats://127.0.0.1:54222
          E2E_WORKDIR: ${{ runner.temp }}/e2e
        run: |
          E2E_PYTHON="$(cd backend && poetry env info --path)/bin/python" bash scripts/e2e/run.sh

      - name: Stop NATS
        if: always()
        run: docker rm -f e2e-nats 2>/dev/null || true

      - name: Keep the logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e/*.log
          if-no-files-found: ignore
