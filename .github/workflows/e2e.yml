name: End to end

# The whole loop against a real Postgres and NATS: scripts/e2e/run.sh starts
# the backend, the workspace daemon and a fake LLM proxy, drives one company
# from its foundation sprint through a blocked task, the ScrumMaster's triage,
# the retrospective, a carry-over and a verified delivery, and checks each
# step through the API. Neo4j is not part of it.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'vscode-daemon/**'
      - 'scripts/e2e/**'
      - '.github/workflows/e2e.yml'


# Un único runner self-hosted atiende un job a la vez: al llegar un push nuevo
# se cancelan las ejecuciones del commit que reemplaza en vez de encolarse.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Runs on the self-hosted runner like every other workflow: hosted runners
    # are blocked by the account's spending limit, so a job on ubuntu-latest
    # never starts and reports a failure it never produced.
    runs-on: [self-hosted, linux, x64, lafabrique]
    timeout-minutes: 25

    # Same venv strategy as backend-tests.yml: install into the uv venv that
    # this job creates and puts on PATH, never into Poetry's global cache.
    env:
      POETRY_VIRTUALENVS_CREATE: "false"

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factorypw
          POSTGRES_DB: factory
        # Non-default host ports: a self-hosted runner sharing the host with
        # `docker compose up` already holds 5432 and 4222.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U factory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      # A service container cannot be given arguments, and the stock NATS
      # image starts without JetStream; the backend needs it for the durable
      # task queue the loop relies on.
      - name: Start NATS with JetStream
        run: |
          docker run -d --name "nats-e2e-$GITHUB_RUN_ID" -p 4223:4222 nats:2.10 -js
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/4223) 2>/dev/null && break
            sleep 1
          done

      - name: Set up Python 3.12 (uv)
        shell: bash
        run: |
          python3 -m pip install --user --break-system-packages uv >/dev/null
          ~/.local/bin/uv python install 3.12
          ~/.local/bin/uv venv --python 3.12 --seed "$RUNNER_TEMP/venv-3.12"
          echo "$RUNNER_TEMP/venv-3.12/bin" >> "$GITHUB_PATH"

      - name: Install the backend
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction

      - name: Run the loop end to end
        env:
          E2E_POSTGRES_HOST: 127.0.0.1
          E2E_POSTGRES_PORT: '5433'
          E2E_POSTGRES_USER: factory
          E2E_POSTGRES_PASSWORD: factorypw
          E2E_NATS_URL: nats://127.0.0.1:4223
          E2E_WORKDIR: ${{ runner.temp }}/e2e
        run: |
          # Not `command -v python`: with POETRY_VIRTUALENVS_CREATE=false that
          # is the bare uv venv, while `poetry install` put the backend's
          # dependencies somewhere else, so the script's psycopg2 import
          # failed. Ask Poetry which interpreter actually has them.
          pick_port() { python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()'; }
          export E2E_BACKEND_PORT="$(pick_port)"
          export E2E_LLM_PORT="$(pick_port)"
          echo "backend port: $E2E_BACKEND_PORT / llm port: $E2E_LLM_PORT"
          E2E_PYTHON="$(cd backend && poetry run python -c 'import sys; print(sys.executable)')" \
            bash scripts/e2e/run.sh

      - name: Stop NATS
        if: always()
        run: docker rm -f "nats-e2e-$GITHUB_RUN_ID" || true

      - name: Keep the logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e/*.log
          if-no-files-found: ignore
