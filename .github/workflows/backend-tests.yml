name: Backend Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'llm-proxy/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction

      - name: Lint with ruff
        working-directory: ./backend
        run: |
          pip install ruff
          ruff check app tests
          ruff format --check app tests

      - name: Type check with mypy
        working-directory: ./backend
        run: |
          pip install mypy
          mypy app --ignore-missing-imports || true

      - name: Run tests
        working-directory: ./backend
        run: |
          PYTHONPATH=.:app poetry run pytest tests -v --tb=short

      - name: Run llm-proxy tests
        working-directory: .
        run: |
          (cd llm-proxy && poetry install --no-interaction --no-root)
          PROXY_PYTHON="$(cd llm-proxy && poetry env info --path)/bin/python"
          "$PROXY_PYTHON" -m pip install -r llm-proxy/requirements-dev.txt
          "$PROXY_PYTHON" -m pytest llm-proxy/tests -q

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: ./backend/htmlcov/
