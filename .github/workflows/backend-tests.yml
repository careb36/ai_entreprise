name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # No `paths:` here: the `changes` job below decides, so the check reports on
  # every pull request (skipped when nothing it reads changed) instead of
  # leaving a required check waiting. The mapping is in changes.yml.

# The self-hosted runners are shared by every pull request and by main: a new
# push cancels the runs of the commit it replaces, on main too (the newest
# commit's run covers the ones merged before it), instead of queueing behind them.
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
    uses: ./.github/workflows/changes.yml

  test:
    needs: changes
    # Runs when the suite's inputs changed, and when the filter itself failed:
    # a broken filter runs too much, never too little.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    # upload-artifact needs to write to the run's artifact store; a bare
    # `contents: read` would make the keep-the-logs step fail.
    permissions:
      contents: read
      actions: write
    runs-on: [self-hosted, linux, x64, lafabrique]
    # Un cuelgue de red en `poetry install` dejó este job 40 minutos parado sin
    # que nadie se enterara (el default son 6 horas). El job entero tarda ~5
    # minutos, así que cortar a los 20 convierte un cuelgue en un fallo visible.
    timeout-minutes: 20
    env:
      # A nivel de job, no de paso: si solo lo tiene `poetry install`, el paso
      # de tests resuelve otro directorio, no encuentra el venv recién creado y
      # hace uno vacío ("Creating virtualenv ...n9PHBxPn" -> "Command not found:
      # pytest"). Con el mismo path, los dos pasos hablan del mismo venv.
      # `runner.temp` no vale aquí: el contexto `runner` solo existe en un `env`
      # de paso, y a nivel de job deja el workflow inválido.
      POETRY_VIRTUALENVS_PATH: ${{ github.workspace }}/.poetry-backend
      # Poetry consulta el keyring en cada operación. En un runner sin sesión
      # de escritorio completa, secretstorage abre DBus, no recibe respuesta y
      # aborta el `poetry install` ("Cannot install greenlet"). No hay ningún
      # secreto que buscar aquí: la clave se lee del entorno.
      POETRY_NO_INTERACTION: "1"
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12 (uv)
        shell: bash
        run: |
          python3 -m pip install --user --break-system-packages uv >/dev/null
          ~/.local/bin/uv python install 3.12
          ~/.local/bin/uv venv --python 3.12 --seed "$RUNNER_TEMP/venv-3.12"
          echo "$RUNNER_TEMP/venv-3.12/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          # `--python` explícito: sin él, uv busca un `.venv` hacia arriba y en
          # este runner encuentra /home/caro/Dev/.venv (Python 3.14, del host).
          # Instalaba Poetry ahí, fuera del PATH, y el siguiente paso moría con
          # `poetry: command not found`.
          ~/.local/bin/uv pip install --python "$RUNNER_TEMP/venv-3.12/bin/python" poetry >/dev/null
          poetry env use python
          poetry install --no-interaction

      - name: Lint with ruff
        working-directory: ./backend
        run: |
          pip install "ruff==0.17.1"
          ruff check app tests
          ruff format --check app tests

      - name: Check the dependency rule between contexts
        # docs/ARCHITECTURE.md, ADR 0012: a new import against the rule or a
        # module in no context fails; the allowlist may only shrink.
        run: python3 -I scripts/check_architecture.py

      - name: Type check with mypy
        working-directory: ./backend
        run: |
          pip install mypy
          # `app` has no __init__.py and imports itself both as `config` and
          # `app.config`, so mypy finds every file twice and aborts before it
          # checks anything. explicit-package-bases keeps it to one module name.
          mypy app --ignore-missing-imports --explicit-package-bases || true

      - name: Check the migrations against the models
        working-directory: ./backend
        run: |
          # The models and the migrations must agree: `alembic check` on a
          # database the migrations built from nothing (a SQLite file here;
          # the e2e does the same on Postgres).
          rm -f "$RUNNER_TEMP/migrations-check.sqlite"
          export ALEMBIC_DATABASE_URL="sqlite:///$RUNNER_TEMP/migrations-check.sqlite"
          PYTHONPATH=.:app poetry run alembic upgrade head
          PYTHONPATH=.:app poetry run alembic check

      - name: Run tests
        working-directory: ./backend
        env:
          WORKERS: ${{ vars.BACKEND_TEST_WORKERS || '4' }}
        run: |
          # In parallel with pytest-xdist (a dev dependency), capped at four
          # workers: the seven self-hosted runners share one machine, and
          # `-n auto` would start a worker per core in every job at once.
          # loadgroup keeps the `xdist_group("wall_clock")` tests on one worker.
          # Each worker holds its own interpreter and SQLite database: fewer
          # workers use less memory and take longer (the repository variable
          # BACKEND_TEST_WORKERS; docs/OPERATIONS.md, Runner capacity).
          PYTHONPATH=.:app poetry run pytest tests -v --tb=short -n "$WORKERS" --dist loadgroup

      - name: Run workspace daemon tests
        working-directory: ./backend
        run: |
          # The daemon's own tests (vscode-daemon/tests) import its modules by
          # name, as the daemon does; they run in the backend's venv, which has
          # pytest and every module the daemon imports.
          poetry run python -m pytest ../vscode-daemon/tests -q

      - name: Run llm-proxy tests
        working-directory: .
        env:
          # El proxy tiene su propio pyproject y necesita un venv separado.
          POETRY_VIRTUALENVS_CREATE: "true"
          POETRY_VIRTUALENVS_PATH: ${{ runner.temp }}/poetry-llm
        run: |
          # `timeout` para que un registro de PyPI que no responde falle con el
          # comando a la vista en vez de colgar el job entero. El install va
          # siempre: es idempotente y sale del caché en segundos, y una guarda
          # del tipo "¿existe pip?" da por bueno un venv vacío.
          # Todo por `poetry run`: `poetry env info --path` puede resolver a otro
          # venv del que `poetry install` acaba de llenar.
          timeout 900 bash -c 'cd llm-proxy && poetry install --no-interaction --no-root'
          timeout 300 poetry run --directory llm-proxy pip install -r requirements-dev.txt
          poetry run --directory llm-proxy python -m pytest -q

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-coverage
          path: ./backend/htmlcov/
