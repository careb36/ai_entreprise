name: Backend Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'llm-proxy/**'
      - '.github/workflows/backend-tests.yml'


# One self-hosted runner takes jobs one at a time: a new push cancels the
# runs of the commit it replaces instead of queueing behind them.
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, x64, lafabrique]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction

      - name: Lint with ruff
        working-directory: ./backend
        run: |
          pip install "ruff==0.17.1"
          ruff check app tests
          ruff format --check app tests

      - name: Type check with mypy
        working-directory: ./backend
        run: |
          pip install mypy
          mypy app --ignore-missing-imports || true

      - name: Run tests
        working-directory: ./backend
        run: |
          PYTHONPATH=.:app poetry run pytest tests -v --tb=short

      - name: Run llm-proxy tests
        working-directory: .
        run: |
          (cd llm-proxy && poetry install --no-interaction --no-root)
          PROXY_PYTHON="$(cd llm-proxy && poetry env info --path)/bin/python"
          "$PROXY_PYTHON" -m pip install -r llm-proxy/requirements-dev.txt
          "$PROXY_PYTHON" -m pytest llm-proxy/tests -q

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-coverage
          path: ./backend/htmlcov/
