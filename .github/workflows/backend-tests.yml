name: Backend Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'llm-proxy/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: [self-hosted, linux, x64, lafabrique]
    env:
      # Usar el venv de uv del job; el caché global de Poetry puede apuntar a una Python rota.
      POETRY_VIRTUALENVS_CREATE: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12 (uv)
        shell: bash
        run: |
          python3 -m pip install --user --break-system-packages uv >/dev/null
          ~/.local/bin/uv python install 3.12
          ~/.local/bin/uv venv --python 3.12 --seed "$RUNNER_TEMP/venv-3.12"
          echo "$RUNNER_TEMP/venv-3.12/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction

      - name: Lint with ruff
        working-directory: ./backend
        run: |
          pip install "ruff==0.17.1"
          ruff check app tests
          ruff format --check app tests

      - name: Type check with mypy
        working-directory: ./backend
        run: |
          pip install mypy
          # `app` has no __init__.py and imports itself both as `config` and
          # `app.config`, so mypy finds every file twice and aborts before it
          # checks anything. explicit-package-bases keeps it to one module name.
          mypy app --ignore-missing-imports --explicit-package-bases || true

      - name: Run tests
        working-directory: ./backend
        run: |
          PYTHONPATH=.:app poetry run pytest tests -v --tb=short

      - name: Run llm-proxy tests
        working-directory: .
        env:
          # El proxy tiene su propio pyproject y necesita un venv separado.
          POETRY_VIRTUALENVS_CREATE: "true"
          POETRY_VIRTUALENVS_PATH: ${{ runner.temp }}/poetry-llm
        run: |
          (cd llm-proxy && poetry install --no-interaction --no-root)
          PROXY_PYTHON="$(cd llm-proxy && poetry env info --path)/bin/python"
          "$PROXY_PYTHON" -m pip install -r llm-proxy/requirements-dev.txt
          "$PROXY_PYTHON" -m pytest llm-proxy/tests -q

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: ./backend/htmlcov/
