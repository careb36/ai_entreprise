name: Frontend CI/CD - Vite Optimization & CDN Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cdn.yml'
      - 'lighthouserc.js'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cdn.yml'
      - 'lighthouserc.js'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    name: Build & Verify Chunking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test -- --run

      - name: Build Optimized Vite Artifacts
        run: |
          cd frontend
          npm run build

      - name: Check Bundle Chunk Sizes
        run: |
          echo "=== Generated Bundles ==="
          ls -lh frontend/dist/assets/
          # Ensure no single chunk exceeds 500 KB limit
          OVERSIZED=$(find frontend/dist/assets -type f -size +500k | wc -l)
          if [ "$OVERSIZED" -gt 0 ]; then
            echo "Error: Found $OVERSIZED bundle chunks exceeding 500 KB threshold."
            exit 1
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  lighthouse-audit:
    name: Lighthouse Performance Evaluation
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Audit with Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.13.x
          lhci autorun --config=./lighthouserc.js || true

  deploy-cdn:
    name: Deploy to Edge CDN (S3 + CloudFront)
    needs: [build-and-test, lighthouse-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync Hashed Assets to CDN (Long-term cache)
        run: |
          aws s3 sync dist/assets s3://${{ secrets.AWS_S3_BUCKET }}/assets \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Sync HTML & Root Assets (No-cache)
        run: |
          aws s3 sync dist s3://${{ secrets.AWS_S3_BUCKET }} \
            --exclude "assets/*" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/index.html"
