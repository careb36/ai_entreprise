name: Glassroom VR to GitHub Pages

# Publishes vr/dist as the repository's GitHub Pages site: the link the
# competition's judges open. It runs on a push to main that touches vr/ once
# the repository variable VR_PAGES is "1" (Settings → Secrets and variables →
# Actions → Variables), and on demand from the Actions tab; Pages must be set
# to deploy from GitHub Actions (Settings → Pages → Source). Until then it
# does nothing, so main stays green.

on:
  push:
    branches: [main]
    paths:
      - "vr/**"
      - ".github/workflows/vr-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vr-pages
  # A deployment in flight finishes; the next push queues behind it.
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.VR_PAGES == '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: vr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vr/package-lock.json
      - run: npm ci
      - run: npm run test:run
      # A project site lives under /<repository name>/.
      - run: npm run build
        env:
          VR_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: vr/dist
      - id: deployment
        uses: actions/deploy-pages@v4
