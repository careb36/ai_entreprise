name: Bench

# The bench (issue #316): scripts/bench/run.sh drives every reference
# specification in bench/specs/ through the factory against a real Postgres,
# NATS, backend and workspace daemon, grades the produced project with the
# acceptance tests a person wrote, and writes a scorecard that
# scripts/bench/compare.py diffs with the newest one committed in
# bench/scorecards/. A drop beyond the thresholds fails the job (and, on the
# nightly run, opens an issue with the diff).
#
# The job `bench` runs the fake LLM (scripts/bench/fake_llm.py): it checks the
# circuit, not the models, and spends no tokens. Its NATS container is the
# bench's alone: the daemon's request subjects are not namespaced, so the
# bench never shares a broker (scripts/bench/broker.py refuses one).
#
# The job `bench-real` runs the same bench on real models, nightly and on
# demand (input `models: real`), and only when the repository variable
# BENCH_REAL_MODELS is `true`: that variable is the kill switch, and unset
# means off, so nothing spends tokens until the owner turns it on. It starts
# the real llm-proxy from llm-proxy/ (as docker compose does) with the
# provider keys from repository secrets, or uses the proxy named by the
# variable BENCH_LLM_URL when set. The run stops past BENCH_TOKEN_BUDGET
# reported tokens (a variable; the default is below), cutting the run
# (scripts/bench/budget.py), and its card is compared with the newest
# real-model reference in bench/scorecards/real/, apart from the fake ones
# (bench/README.md, "The nightly real-model run").

on:
  workflow_dispatch:
    inputs:
      models:
        description: "fake (the circuit, no tokens) or real (spends tokens; needs the variable BENCH_REAL_MODELS=true)"
        type: choice
        options: [fake, real]
        default: fake
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    # Nightly and on demand, unless a person asked for the real models only.
    if: inputs.models != 'real'
    permissions:
      contents: read
      actions: write   # upload-artifact
      issues: write    # the nightly regression issue
    runs-on: [self-hosted, linux, x64, lafabrique]
    timeout-minutes: 30
    env:
      # Same reasons as the e2e: the venv is shared between steps, and Poetry
      # must not reach for a desktop keyring on the runner.
      POETRY_VIRTUALENVS_PATH: ${{ github.workspace }}/.poetry-backend
      POETRY_NO_INTERACTION: "1"
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Postgres, NATS and pick free ports
        run: |
          # Docker picks the host ports (see e2e.yml for why), read back here.
          docker run -d --name "pg-bench-$GITHUB_RUN_ID" \
            -e POSTGRES_USER=factory -e POSTGRES_PASSWORD=factorypw -e POSTGRES_DB=factory \
            -p "127.0.0.1::5432" pgvector/pgvector:pg15
          docker run -d --name "nats-bench-$GITHUB_RUN_ID" -p "127.0.0.1::4222" nats:2.10 -js
          pg_port="$(docker port "pg-bench-$GITHUB_RUN_ID" 5432/tcp | head -1 | sed 's/.*://')"
          nats_port="$(docker port "nats-bench-$GITHUB_RUN_ID" 4222/tcp | head -1 | sed 's/.*://')"
          for _ in $(seq 1 60); do
            docker exec "pg-bench-$GITHUB_RUN_ID" pg_isready -U factory -h 127.0.0.1 >/dev/null 2>&1 && break
            sleep 1
          done
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/"$nats_port") 2>/dev/null && break
            sleep 1
          done
          docker exec "pg-bench-$GITHUB_RUN_ID" pg_isready -U factory -h 127.0.0.1
          {
            echo "BENCH_POSTGRES_HOST=127.0.0.1"
            echo "BENCH_POSTGRES_PORT=$pg_port"
            echo "BENCH_POSTGRES_USER=factory"
            echo "BENCH_POSTGRES_PASSWORD=factorypw"
            echo "BENCH_NATS_URL=nats://127.0.0.1:$nats_port"
          } >> "$GITHUB_ENV"

      - name: Set up Python 3.12 (uv)
        run: |
          python3 -m pip install --user --break-system-packages uv >/dev/null
          ~/.local/bin/uv python install 3.12
          ~/.local/bin/uv venv --python 3.12 --seed "$RUNNER_TEMP/venv-3.12"
          echo "$RUNNER_TEMP/venv-3.12/bin" >> "$GITHUB_PATH"

      - name: Install the backend
        working-directory: ./backend
        run: |
          ~/.local/bin/uv pip install --python "$RUNNER_TEMP/venv-3.12/bin/python" poetry >/dev/null
          poetry env use python
          poetry install --no-interaction

      - name: Run the bench (fake LLM)
        env:
          BENCH_WORKDIR: ${{ runner.temp }}/bench
        run: |
          pick_port() { python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()'; }
          BENCH_BACKEND_PORT="$(pick_port)" BENCH_LLM_PORT="$(pick_port)" \
          BENCH_PYTHON="$(cd backend && poetry run python -c 'import sys; print(sys.executable)')" \
            bash scripts/bench/run.sh --out "$RUNNER_TEMP/bench-out"

      - name: Compare with the previous scorecard
        id: compare
        # Also when the run failed (a broken circuit still writes its
        # scorecard): a nightly regression must get its diff and its issue.
        if: always()
        run: |
          card="$(find "$RUNNER_TEMP/bench-out" -maxdepth 1 -name '*.json' 2>/dev/null | sort | tail -1)"
          if [ -z "$card" ]; then
            echo "No scorecard was written: nothing to compare." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +e
          python3 scripts/bench/compare.py "$card" --dir bench/scorecards > "$RUNNER_TEMP/bench-out/compare.md"
          status=$?
          set -e
          { cat "${card%.json}.md"; echo; cat "$RUNNER_TEMP/bench-out/compare.md"; } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/bench-out/compare.md"
          exit $status

      - name: Open an issue on a nightly regression
        if: failure() && steps.compare.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Bench regression $(date -u +%F)" \
            --body-file "$RUNNER_TEMP/bench-out/compare.md"

      - name: Stop the containers
        if: always()
        run: docker rm -f "pg-bench-$GITHUB_RUN_ID" "nats-bench-$GITHUB_RUN_ID" || true

      - name: Keep the scorecard and the logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench
          path: |
            ${{ runner.temp }}/bench-out/
            ${{ runner.temp }}/bench/*.log
            ${{ runner.temp }}/bench/*.grade.json
          if-no-files-found: ignore

  bench-real:
    # The kill switch: off unless the repository variable says `true`.
    if: vars.BENCH_REAL_MODELS == 'true' && (github.event_name == 'schedule' || inputs.models == 'real')
    permissions:
      contents: read
      actions: write   # upload-artifact
      issues: write    # the nightly regression issue
    runs-on: [self-hosted, linux, x64, lafabrique]
    # Bounds the wall-clock of the whole run; BENCH_TIMEOUT bounds each sprint.
    timeout-minutes: 120
    env:
      POETRY_VIRTUALENVS_PATH: ${{ github.workspace }}/.poetry-backend
      POETRY_NO_INTERACTION: "1"
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
      # Conservative defaults; the owner sets the repository variables to change them.
      BENCH_TOKEN_BUDGET: ${{ vars.BENCH_TOKEN_BUDGET || '300000' }}
      BENCH_TIMEOUT: ${{ vars.BENCH_TIMEOUT || '1200' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Postgres, NATS and pick free ports
        run: |
          docker run -d --name "pg-bench-real-$GITHUB_RUN_ID" \
            -e POSTGRES_USER=factory -e POSTGRES_PASSWORD=factorypw -e POSTGRES_DB=factory \
            -p "127.0.0.1::5432" pgvector/pgvector:pg15
          docker run -d --name "nats-bench-real-$GITHUB_RUN_ID" -p "127.0.0.1::4222" nats:2.10 -js
          pg_port="$(docker port "pg-bench-real-$GITHUB_RUN_ID" 5432/tcp | head -1 | sed 's/.*://')"
          nats_port="$(docker port "nats-bench-real-$GITHUB_RUN_ID" 4222/tcp | head -1 | sed 's/.*://')"
          for _ in $(seq 1 60); do
            docker exec "pg-bench-real-$GITHUB_RUN_ID" pg_isready -U factory -h 127.0.0.1 >/dev/null 2>&1 && break
            sleep 1
          done
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/"$nats_port") 2>/dev/null && break
            sleep 1
          done
          docker exec "pg-bench-real-$GITHUB_RUN_ID" pg_isready -U factory -h 127.0.0.1
          {
            echo "BENCH_POSTGRES_HOST=127.0.0.1"
            echo "BENCH_POSTGRES_PORT=$pg_port"
            echo "BENCH_POSTGRES_USER=factory"
            echo "BENCH_POSTGRES_PASSWORD=factorypw"
            echo "BENCH_NATS_URL=nats://127.0.0.1:$nats_port"
          } >> "$GITHUB_ENV"

      - name: Start the LLM proxy (real models)
        env:
          # A proxy already running on the runner, preferred when set.
          PROXY_URL: ${{ vars.BENCH_LLM_URL }}
          # The names the proxy reads (llm-proxy/app.py, docker-compose.yml).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
        run: |
          healthy() { curl -sf -m 5 "$1/health" | python3 -c 'import json, sys; sys.exit(json.load(sys.stdin).get("status") != "healthy")' 2>/dev/null; }
          if [ -n "$PROXY_URL" ]; then
            healthy "$PROXY_URL" || { echo "::error::the proxy named by the variable BENCH_LLM_URL does not answer /health"; exit 1; }
            echo "Using the proxy named by the variable BENCH_LLM_URL."
            echo "BENCH_LLM_URL=$PROXY_URL" >> "$GITHUB_ENV"
            exit 0
          fi
          # The keys the default roles need (docs/CONFIGURATION.md); the others
          # are optional. Names only, never values.
          missing=""
          for name in GEMINI_API_KEY DEEPSEEK_API_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::the real-model bench needs the repository secret(s):$missing"
            exit 1
          fi
          docker build -q -t "llm-proxy-bench:$GITHUB_RUN_ID" llm-proxy >/dev/null
          # -e NAME passes the value from this step's environment, never on the command line.
          docker run -d --name "llm-proxy-bench-$GITHUB_RUN_ID" -p "127.0.0.1::5100" \
            -e GEMINI_API_KEY -e DEEPSEEK_API_KEY -e QWEN_API_KEY -e NEBIUS_API_KEY \
            -e PROXY_PORT=5100 -e OTEL_SDK_DISABLED=true \
            "llm-proxy-bench:$GITHUB_RUN_ID" >/dev/null
          port="$(docker port "llm-proxy-bench-$GITHUB_RUN_ID" 5100/tcp | head -1 | sed 's/.*://')"
          for _ in $(seq 1 90); do healthy "http://127.0.0.1:$port" && break; sleep 2; done
          if ! healthy "http://127.0.0.1:$port"; then
            echo "::error::the LLM proxy did not become healthy"
            docker logs --tail 50 "llm-proxy-bench-$GITHUB_RUN_ID" 2>&1 || true
            exit 1
          fi
          echo "BENCH_LLM_URL=http://127.0.0.1:$port" >> "$GITHUB_ENV"

      - name: Set up Python 3.12 (uv)
        run: |
          python3 -m pip install --user --break-system-packages uv >/dev/null
          ~/.local/bin/uv python install 3.12
          ~/.local/bin/uv venv --python 3.12 --seed "$RUNNER_TEMP/venv-3.12"
          echo "$RUNNER_TEMP/venv-3.12/bin" >> "$GITHUB_PATH"

      - name: Install the backend
        working-directory: ./backend
        run: |
          ~/.local/bin/uv pip install --python "$RUNNER_TEMP/venv-3.12/bin/python" poetry >/dev/null
          poetry env use python
          poetry install --no-interaction

      - name: Run the bench (real models)
        env:
          BENCH_WORKDIR: ${{ runner.temp }}/bench-real
        run: |
          echo "Token budget: $BENCH_TOKEN_BUDGET reported tokens; $BENCH_TIMEOUT s per sprint."
          pick_port() { python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()'; }
          BENCH_BACKEND_PORT="$(pick_port)" BENCH_LLM_PORT="$(pick_port)" \
          BENCH_PYTHON="$(cd backend && poetry run python -c 'import sys; print(sys.executable)')" \
            bash scripts/bench/run.sh --out "$RUNNER_TEMP/bench-real-out"

      - name: Compare with the newest real-model reference
        id: compare
        if: always()
        run: |
          card="$(find "$RUNNER_TEMP/bench-real-out" -maxdepth 1 -name '*.json' 2>/dev/null | sort | tail -1)"
          if [ -z "$card" ]; then
            echo "No scorecard was written: nothing to compare." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! ls bench/scorecards/real/*.json >/dev/null 2>&1; then
            {
              cat "${card%.json}.md"
              echo
              echo "No real-model reference in bench/scorecards/real/ yet: nothing to compare."
              echo "A card becomes the reference only when a person commits it there (bench/README.md)."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +e
          python3 scripts/bench/compare.py "$card" --dir bench/scorecards/real > "$RUNNER_TEMP/bench-real-out/compare.md"
          status=$?
          set -e
          { cat "${card%.json}.md"; echo; cat "$RUNNER_TEMP/bench-real-out/compare.md"; } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/bench-real-out/compare.md"
          exit $status

      - name: Open an issue on a nightly real-model regression
        if: failure() && steps.compare.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Bench regression (real models) $(date -u +%F)" \
            --body-file "$RUNNER_TEMP/bench-real-out/compare.md"

      - name: Stop the containers
        if: always()
        run: |
          docker rm -f "pg-bench-real-$GITHUB_RUN_ID" "nats-bench-real-$GITHUB_RUN_ID" "llm-proxy-bench-$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          docker rmi "llm-proxy-bench:$GITHUB_RUN_ID" >/dev/null 2>&1 || true

      - name: Keep the scorecard and the logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-real
          path: |
            ${{ runner.temp }}/bench-real-out/
            ${{ runner.temp }}/bench-real/*.log
            ${{ runner.temp }}/bench-real/*.grade.json
          if-no-files-found: ignore
