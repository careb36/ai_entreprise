name: Bench (pull request)

# The fake-model bench on a pull request (issue #316): the job `bench` of
# bench.yml, the nightly fake run, on a pull request into main that changes
# what the bench drives or grades (the filter in the job `changes` below).
# scripts/bench/run.sh drives every reference specification in bench/specs/
# through the factory with the fake LLM (scripts/bench/fake_llm.py), grades
# each produced project with the acceptance tests a person wrote, and
# scripts/bench/compare.py diffs the scorecard with the newest one committed
# in bench/scorecards/, with the same thresholds as the nightly run: a
# regression fails this check.
#
# No real model, no secret, no kill switch: the real-model run, the watch
# after a merge and the revert live in bench.yml and never start from a pull
# request. Nor the nightly extras: no strict performance budgets (the machine
# is shared with the other pull requests' jobs) and no issue (the failed
# check is the report). backend/tests/test_ci_paths.py holds the steps below
# to bench.yml's fake job, so the two runs cannot drift apart.

on:
  # No `paths:` here (backend/tests/test_ci_paths.py): the job `changes`
  # decides, and the check reports "skipped" when nothing it reads changed.
  pull_request:
    branches: [main]

# Per ref, so another pull request's run is never cancelled; a new push
# cancels the superseded run (#559).
concurrency:
  group: bench-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Its own filter rather than an output of changes.yml: the backend filter
    # there also holds CHANGELOG.md and the docs the backend suite reads, so
    # nearly every pull request would run the bench. Read by
    # scripts/changed_paths.py, the same script and glob rules as changes.yml.
    runs-on: [self-hosted, linux, x64, lafabrique]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      bench: ${{ steps.filter.outputs.bench }}
    steps:
      - name: Check out both ends of the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The two shas below and their merge base must be in the clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Match the changed files against the bench's filter
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # What the bench drives (the backend, its migrations and
          # dependencies, the workspace daemon), what it grades with (the
          # specifications, their acceptance tests and fake answers, the
          # reference cards, the runner and the scorecard) and the two
          # workflows that run it.
          FILTERS: |
            bench:
              - 'bench/**'
              - 'scripts/bench/**'
              - 'backend/app/**'
              - 'backend/alembic/**'
              - 'backend/alembic.ini'
              - 'backend/pyproject.toml'
              - 'backend/poetry.lock'
              - 'vscode-daemon/**'
              - '.github/workflows/bench.yml'
              - '.github/workflows/bench-pr.yml'
        # A failure here fails the job, and `bench` then runs rather than not.
        run: |
          python3 scripts/changed_paths.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  bench:
    needs: changes
    # When the filter matched, or when it could not run: a broken filter runs
    # the bench rather than skipping it.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.bench == 'true') }}
    permissions:
      contents: read
      actions: write   # upload-artifact
    # The same stack as an e2e job (Postgres, NATS, the backend and the
    # daemon), so it takes an e2e slot once the variable E2E_RUNS_ON names the
    # label (docs/OPERATIONS.md, Runner capacity); unset, any runner.
    runs-on: ${{ fromJSON(vars.E2E_RUNS_ON || '["self-hosted","linux","x64","lafabrique"]') }}
    timeout-minutes: 30
    env:
      POETRY_VIRTUALENVS_PATH: ${{ github.workspace }}/.poetry-backend
      POETRY_NO_INTERACTION: "1"
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # read-only: no token left in .git/config

      - name: Start Postgres, NATS and pick free ports
        run: |
          # Docker picks the host ports (see e2e.yml for why), read back here.
          docker run -d --name "pg-bench-$GITHUB_RUN_ID" \
            -e POSTGRES_USER=factory -e POSTGRES_PASSWORD=factorypw -e POSTGRES_DB=factory \
            -p "127.0.0.1::5432" pgvector/pgvector:pg15
          docker run -d --name "nats-bench-$GITHUB_RUN_ID" -p "127.0.0.1::4222" nats:2.10 -js
          pg_port="$(docker port "pg-bench-$GITHUB_RUN_ID" 5432/tcp | head -1 | sed 's/.*://')"
          nats_port="$(docker port "nats-bench-$GITHUB_RUN_ID" 4222/tcp | head -1 | sed 's/.*://')"
          for _ in $(seq 1 60); do
            docker exec "pg-bench-$GITHUB_RUN_ID" pg_isready -U factory -h 127.0.0.1 >/dev/null 2>&1 && break
            sleep 1
          done
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/"$nats_port") 2>/dev/null && break
            sleep 1
          done
          docker exec "pg-bench-$GITHUB_RUN_ID" pg_isready -U factory -h 127.0.0.1
          {
            echo "BENCH_POSTGRES_HOST=127.0.0.1"
            echo "BENCH_POSTGRES_PORT=$pg_port"
            echo "BENCH_POSTGRES_USER=factory"
            echo "BENCH_POSTGRES_PASSWORD=factorypw"
            echo "BENCH_NATS_URL=nats://127.0.0.1:$nats_port"
          } >> "$GITHUB_ENV"

      - name: Set up Python 3.12 (uv)
        run: |
          python3 -m pip install --user --break-system-packages uv >/dev/null
          ~/.local/bin/uv python install 3.12
          ~/.local/bin/uv venv --python 3.12 --seed "$RUNNER_TEMP/venv-3.12"
          echo "$RUNNER_TEMP/venv-3.12/bin" >> "$GITHUB_PATH"

      - name: Install the backend
        working-directory: ./backend
        run: |
          ~/.local/bin/uv pip install --python "$RUNNER_TEMP/venv-3.12/bin/python" poetry >/dev/null
          poetry env use python
          poetry install --no-interaction

      - name: Run the bench (fake LLM)
        env:
          BENCH_WORKDIR: ${{ runner.temp }}/bench
          # As in bench.yml: in the daemon's sandbox once the runner holds a
          # grading image named by this variable, in-process until then.
          BENCH_GRADING_IMAGE: ${{ vars.BENCH_GRADING_IMAGE }}
          BENCH_GRADE_IN_PROCESS: ${{ vars.BENCH_GRADING_IMAGE == '' && '1' || '' }}
        run: |
          pick_port() { python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()'; }
          BENCH_BACKEND_PORT="$(pick_port)" BENCH_LLM_PORT="$(pick_port)" \
          BENCH_PYTHON="$(cd backend && poetry run python -c 'import sys; print(sys.executable)')" \
            bash scripts/bench/run.sh --out "$RUNNER_TEMP/bench-out"

      - name: Compare with the previous scorecard
        # Also when the run failed: a broken circuit still writes its
        # scorecard, and the diff says what broke.
        if: always()
        run: |
          card="$(find "$RUNNER_TEMP/bench-out" -maxdepth 1 -name '*.json' 2>/dev/null | sort | tail -1)"
          if [ -z "$card" ]; then
            echo "No scorecard was written: nothing to compare." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +e
          python3 scripts/bench/compare.py "$card" --dir bench/scorecards > "$RUNNER_TEMP/bench-out/compare.md"
          status=$?
          set -e
          { cat "${card%.json}.md"; echo; cat "$RUNNER_TEMP/bench-out/compare.md"; } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/bench-out/compare.md"
          exit $status

      - name: Stop the containers
        if: always()
        run: docker rm -f "pg-bench-$GITHUB_RUN_ID" "nats-bench-$GITHUB_RUN_ID" || true

      - name: Keep the scorecard and the logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-pr
          path: |
            ${{ runner.temp }}/bench-out/
            ${{ runner.temp }}/bench/*.log
            ${{ runner.temp }}/bench/*.grade.json
          if-no-files-found: ignore
