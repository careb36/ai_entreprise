# File sizes — a source or test file over the line limit may not grow
# (scripts/check_file_sizes.py, baselines in scripts/file_size_baseline.json
# and scripts/test_file_size_baseline.json).
#
# Run the same check locally with:
#   python3 scripts/check_file_sizes.py

name: File Sizes

on:
  push:
    branches: [main]
  pull_request:
  # Which pull requests run the check: the `changes` job (changes.yml).

permissions:
  contents: read


# The self-hosted runners are shared by every pull request and by main: a new
# push cancels the runs of the commit it replaces, on main too (the newest
# commit's run covers the ones merged before it), instead of queueing behind them.
concurrency:
  group: file-sizes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  check:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.file-sizes == 'true') }}
    runs-on: [self-hosted, linux, x64, lafabrique]
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No file over the limit grows
        run: python3 scripts/check_file_sizes.py
