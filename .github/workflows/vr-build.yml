name: Glassroom VR

on:
  pull_request:
    paths:
      - "vr/**"
      - ".github/workflows/vr-build.yml"
  push:
    branches: [main, develop]
    paths:
      - "vr/**"
      - ".github/workflows/vr-build.yml"

jobs:
  build:
    name: typecheck, test, and build (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vr/package-lock.json
      - run: npm ci
      - run: npm run test:run
      - run: npm run build
