# Workflows — the YAML a pull request touches is checked before it lands.
#
# A workflow GitHub cannot evaluate does not fail at the step that broke it: it
# produces a job with no steps that fails in two seconds, and the log is empty
# (the blob never exists). `actionlint` catches the same class of problem —
# an unknown `env` context, a duplicated key, a typo in a `uses` — as a line
# number and an explanation.
#
# Run the same check locally with:
#   actionlint .github/workflows/*.yml

name: Workflows

on:
  push:
    branches: [main]
  pull_request:
  # Which pull requests run the lint: the `changes` job (changes.yml), when a
  # workflow or .github/actionlint.yaml changed.

permissions:
  contents: read


# The self-hosted runners are shared by every pull request and by main: a new
# push cancels the runs of the commit it replaces, on main too (the newest
# commit's run covers the ones merged before it), instead of queueing behind them.
concurrency:
  group: workflows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.workflows == 'true') }}
    runs-on: [self-hosted, linux, x64, lafabrique]
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every workflow parses and every expression resolves
        # By digest, not tag: a tag can be pushed again, a digest cannot.
        # backend/tests/test_workflow_pinning.py requires it. Resolve a new
        # one with `docker buildx imagetools inspect rhysd/actionlint:<version>`.
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # 1.7.7
        with:
          args: -color
