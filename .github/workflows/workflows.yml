# Workflows — the YAML a pull request touches is checked before it lands.
#
# A workflow GitHub cannot evaluate does not fail at the step that broke it: it
# produces a job with no steps that fails in two seconds, and the log is empty
# (the blob never exists). `actionlint` catches the same class of problem —
# an unknown `env` context, a duplicated key, a typo in a `uses` — as a line
# number and an explanation.
#
# Run the same check locally with:
#   actionlint .github/workflows/*.yml

name: Workflows

on:
  push:
    branches: [main]
  pull_request:
  # Which pull requests run the lint: the `changes` job (changes.yml), when a
  # workflow or .github/actionlint.yaml changed.

permissions:
  contents: read


# The self-hosted runners are shared by every pull request and by main: a new
# push cancels the runs of the commit it replaces, on main too (the newest
# commit's run covers the ones merged before it), instead of queueing behind them.
concurrency:
  group: workflows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
    uses: ./.github/workflows/changes.yml

  lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.workflows == 'true') }}
    runs-on: [self-hosted, linux, x64, lafabrique]
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint (pinned + checksum)
        # A release tarball, not the published container image: to this
        # repository's Actions policy (Settings -> Actions -> General: GitHub
        # owned and verified creators only) a `docker://` step is a
        # third-party action, and a workflow that names one never starts —
        # the whole run reports `startup_failure` with no job and no log. The
        # download is pinned and verified the way security-scan.yml installs
        # uv, gitleaks and semgrep.
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 actionlint "$RUNNER_TEMP/bin/actionlint"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/actionlint" --version

      - name: Every workflow parses and every expression resolves
        run: actionlint -color
