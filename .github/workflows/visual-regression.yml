name: Visual Regression Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'frontend/**'
      - '.github/workflows/visual-regression.yml'

jobs:
  visual-regression:
    name: Execute Visual Regression & UI Integrity Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright Browsers & Dependencies
        run: |
          cd frontend
          npx playwright install --with-deps chromium firefox

      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build

      - name: Execute Playwright Visual Regression Tests
        run: |
          cd frontend
          npm run test:visual

      - name: Upload Visual Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-regression-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
