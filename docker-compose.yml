services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: factory-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP/HTTP receiver
    networks:
      - factory-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:latest
    container_name: factory-nats
    ports:
      - "4222:4222"
    volumes:
      - nats-data:/data
    networks:
      - factory-network
    healthcheck:
      test: ["CMD", "nats-server", "-v"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg15
    container_name: factory-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-factory}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init-db:/docker-entrypoint-initdb.d
    networks:
      - factory-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.15-enterprise
    container_name: factory-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/factory}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "eval"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 2G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - factory-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  llm-proxy:
    build:
      context: ./llm-proxy
      dockerfile: Dockerfile
    container_name: factory-llm-proxy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-factory}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      PROXY_PORT: 5100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "5100:5100"
    volumes:
      - ./llm-proxy/app.py:/app/app.py
    networks:
      - factory-network
    depends_on:
      - jaeger
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5100/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: factory-backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-factory}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AUTH_REQUIRED: ${AUTH_REQUIRED}
      NATS_URL: nats://nats:4222
      LLM_PROXY_URL: http://llm-proxy:5100
      AUDIT_LOG_PATH: /app/.factory/logs
      AGENT_WORKSPACE_ROOT: ${CONTAINER_WORKSPACE_ROOT:-/workspace}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/agents:/app/agents
      - ./backend/llm:/app/llm
      - ./backend/memory:/app/memory
      - ./backend/telemetry.py:/app/telemetry.py
      - factory-logs:/app/.factory
      - ./:${CONTAINER_WORKSPACE_ROOT:-/workspace}:ro
    networks:
      - factory-network
    depends_on:
      llm-proxy:
        condition: service_healthy
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      jaeger:
        condition: service_healthy

  vscode-daemon:
    image: python:3.11-slim
    container_name: factory-vscode-daemon
    environment:
      NATS_URL: nats://nats:4222
      WORKSPACE_ROOT: ${CONTAINER_WORKSPACE_ROOT:-/workspace}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    working_dir: /app
    command: sh -lc "pip install --no-cache-dir nats-py==2.3.1 && python /app/daemon.py"
    volumes:
      - ./:${CONTAINER_WORKSPACE_ROOT:-/workspace}
      - ./vscode-daemon/daemon.py:/app/daemon.py:ro
    networks:
      - factory-network
    depends_on:
      nats:
        condition: service_healthy

  janitor:
    build:
      context: .
      dockerfile: backend/janitor/Dockerfile
    container_name: factory-janitor
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-factory}
    networks:
      - factory-network
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: factory-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_DEFAULT_PROJECT_PATH: ${CONTAINER_WORKSPACE_ROOT:-/workspace}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
    networks:
      - factory-network
    depends_on:
      - backend

volumes:
  nats-data:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  factory-logs:

networks:
  factory-network:
    driver: bridge
