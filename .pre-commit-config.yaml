# Pre-commit hooks: enforce the same gates CI runs, locally, before commit,
# and reinstall the frontend's dependencies after a pull that changed them.
# Install:
#   pip install pre-commit
#   pre-commit install --hook-type pre-commit --hook-type post-merge --hook-type post-rewrite
default_stages: [pre-commit]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/(app|tests)/.*\.py$
      - id: ruff-format
        files: ^backend/(app|tests)/.*\.py$
  # Secrets in the staged changes, with the same rules and allowlist as CI
  # (.gitleaks.toml; security-scan.yml job `secrets-pr`). Pinned by commit,
  # the version CI downloads (v8.21.2); pre-commit builds it with Go, which it
  # fetches itself on first use. `git commit --no-verify` skips every hook,
  # and CI still scans the pull request's commits.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 43fae355e6fe4d99d2a7b240a224b85e2903aeb4  # frozen: v8.21.2
    hooks:
      - id: gitleaks
        args: [--config, .gitleaks.toml]
  - repo: local
    hooks:
      - id: no-secrets
        name: no secrets in diff
        entry: bash -c 'if git diff --cached --name-only | grep -qE "(^|/)\\.env(\\.|$)"; then echo "Do not commit .env files"; exit 1; fi'
        language: system
        pass_filenames: false
      - id: sync-frontend-deps
        name: npm ci when frontend/package-lock.json changed
        entry: scripts/hooks/sync-frontend-deps.sh
        language: script
        pass_filenames: false
        always_run: true
        # Its warnings (npm missing, a failed install) exit 0; without this
        # pre-commit would hide them behind "Passed".
        verbose: true
        stages: [post-merge, post-rewrite]