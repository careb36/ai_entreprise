apiVersion: batch/v1
kind: Job
metadata:
  name: preqa-sandbox-job
  namespace: default
  labels:
    app.kubernetes.io/name: preqa-sandbox
    app.kubernetes.io/component: sandbox-runner
spec:
  activeDeadlineSeconds: 30
  backoffLimit: 0
  ttlSecondsAfterFinished: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: preqa-sandbox
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandbox-container
          image: lafabrique/preqa-sandbox:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: SANDBOX_PORT
              value: "8080"
            - name: SANDBOX_TIMEOUT_SECONDS
              value: "30"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
