        ],
        "summary": "Search Memory",
        "description": "Search the vector memory store for content similar to *query*.\n\nUses pgvector cosine similarity on pre-computed embeddings.\nReturns up to *limit* results sorted by descending similarity.",
        "operationId": "search_memory_v1_memory_search_get",
        "parameters": [
          {
            "name": "query",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "title": "Query"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "default": 10,
              "title": "Limit"
            }
          },
          {
            "name": "company_id",
            "in": "query",
