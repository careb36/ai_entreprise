      "post": {
        "tags": [
          "Enterprise",
          "Enterprise"
        ],
        "summary": "Discover Team",
        "description": "Scan a project path to detect its technology stack and suggest an AI team.\n\nPhase 1 (deterministic): filesystem walk + config-file parsing.\nPhase 2 (AI): LLM proxy reasons about the stack and suggests a team with\nper-role justifications. Falls back to rule-based team if LLM unavailable.\n\nIf ``company_id`` is provided, the result is persisted in the\n``project_discovery`` table.",
        "operationId": "discover_team_v1_discover_team_post",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DiscoveryRequest"
