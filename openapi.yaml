    "/v1/models": {
      "get": {
        "tags": [
          "Enterprise",
          "Enterprise"
        ],
        "summary": "List Models",
        "description": "Return the live LLM model catalogue from the proxy.\n\nProxies the ``/v1/models`` response from the internal LLM proxy so that\nthe frontend can build a dynamic model selector without hardcoding model\nnames or tiers.  The proxy refreshes its catalogue from the Gemini API\nevery hour and classifies models by capability tier.\n\nResponse shape::\n\n    {\n      \"models\": [\n        {\"id\": \"gemini-2.5-pro\", \"provider\": \"gemini\", \"tier\": \"strategic\", \"description\": \"...\"},\n        ...\n      ],\n      \"orchestrator\": \"gemini-2.5-flash\",\n      \"refreshed_at\": 1712345678.0\n    }",
        "operationId": "list_models_v1_models_get",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          }
        }
      }
    },
