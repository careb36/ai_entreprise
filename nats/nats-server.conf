# (NATS_BACKEND_PASSWORD, NATS_DAEMON_PASSWORD). See SECURITY.md.

authorization: {
  "users": [
    {
      "user": "backend",
      "password": $NATS_BACKEND_PASSWORD,
      "permissions": {
        "publish": {
          "allow": [
            "workspace.>",
            "task.>",
            "glassroom.>",
            "audit.>",
            "system.>",
            "$JS.API.>",
            "$JS.ACK.>"
          ]
        },
        "subscribe": {
          "allow": [
            "_INBOX.backend.>",
            "glassroom.>",
            "workspace.>",
            "task.>"
          ]
        }
      }
    },
    {
      "user": "daemon",
      "password": $NATS_DAEMON_PASSWORD,
      "permissions": {
        "publish": {
          "allow": [
            "workspace.delivered",
            "glassroom.*",
            "$JS.API.INFO",
            "$JS.API.STREAM.INFO.FABRIQUE_DELIVERIES",
            "$JS.API.STREAM.INFO.FABRIQUE_DELIVERY_RESULTS",
            "$JS.API.CONSUMER.INFO.FABRIQUE_DELIVERIES.workspace-daemon",
            "$JS.API.CONSUMER.CREATE.FABRIQUE_DELIVERIES.workspace-daemon",
            "$JS.API.CONSUMER.CREATE.FABRIQUE_DELIVERIES.workspace-daemon.workspace.deliver",
            "$JS.API.CONSUMER.DURABLE.CREATE.FABRIQUE_DELIVERIES.workspace-daemon",
            "$JS.API.CONSUMER.MSG.NEXT.FABRIQUE_DELIVERIES.workspace-daemon",
            "$JS.ACK.FABRIQUE_DELIVERIES.workspace-daemon.>"
          ]
        },
        "subscribe": {
          "allow": [
            "workspace.>",
            "_INBOX.daemon.>"
          ]
        },
        "allow_responses": {
          "max": 1,
          "expires": "30m"
        }
      }
    }
  ]
}
