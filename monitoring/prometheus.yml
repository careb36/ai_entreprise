global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: fabrique-backend
    static_configs:
      - targets: ["backend:8000"]
  - job_name: llm-proxy
    static_configs:
      - targets: ["llm-proxy:5100"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
