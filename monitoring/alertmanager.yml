global:
  smtp_smarthost: "mailpit:1025"
  smtp_from: "alerts@fabrique.local"
  smtp_require_tls: false

route:
  receiver: fabrique-email
  group_by: ["alertname", "job"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: fabrique-email
    email_configs:
      - to: "ops@fabrique.local"
        send_resolved: true
